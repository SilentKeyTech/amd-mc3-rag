name: build-submission

on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag
        default: v1
  push:
    branches: [main]
    paths: ["app/**", "scripts/assemble_image.sh", "requirements.txt", ".github/workflows/build.yml"]

permissions:
  contents: read
  packages: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Contract and citation logic against the sample corpus (mock model)
        run: |
          pip install -q pypdf pillow
          # run as a non-root user so the mode-000 file genuinely raises
          cp -r . /tmp/w && cd /tmp/w
          mkdir -p tests/corpus/mc3-corpus/archive
          sudo useradd -M tester || true
          chmod -R a+rwX /tmp/w && chmod 000 tests/corpus/mc3-corpus/vendor/internal_audit.txt
          sudo -u tester env PATH="$PATH" python tests/run_local.py tests/corpus/mc3-corpus tests/corpus/sample-questions.json | tee /tmp/out.txt
          grep -q "score 200/200" /tmp/out.txt
          grep -q "skipped vendor/internal_audit.txt  permission" /tmp/out.txt
          sudo -u tester env PATH="$PATH" sh tests/plumbing.sh python tests/corpus/mc3-corpus

  image:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BASE: docker.io/rocm/pytorch@sha256:3174cb7061d94c427da96c0edef4adea28046fa3f3b2ff3948dc4e995665ff8c
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null || true
          df -h /
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - name: Tools
        run: |
          curl -sSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin crane
          crane version
          # CPU torch in the runner's own 3.14, only to prove the package layer imports
          python3.14 -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python3.14 -m pip install -q numpy pillow
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Assemble image in the registry (no base extraction)
        run: |
          TAG="${{ github.event.inputs.tag || 'v1' }}"
          export TARGET="ghcr.io/$(echo '${{ github.repository_owner }}' | tr A-Z a-z)/mc3-rag:$TAG"
          export PYVER=3.14
          bash scripts/assemble_image.sh
          echo "built $TARGET" >> $GITHUB_STEP_SUMMARY
